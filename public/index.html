
<!DOCTYPE html>
<html lang="id">
<head>

      <a class="brand" href="#" data-page="home">
        <span class="logo">G</span>
        <span class="brand-text">AI <b>GAZ</b>
          <small>DEVELOPER WORKSPACE</small>
        </span>
      </a>

      <button class="new-chat" data-action="new-chat">＋ &nbsp; Chat Baru</button>

      <div class="label">WORKSPACE</div>
      <nav>
        <button class="nav active" data-page="home"><span>⌂</span> Beranda</button>
        <button class="nav" data-page="chat"><span>▤</span> Chat AI</button>
        <button class="nav" data-page="coding"><span>⌘</span> AI Coding</button>
        <button class="nav" data-page="creative"><span>✧</span> AI Kreatif</button>
        <button class="nav" data-page="islamic"><span>☪</span> Pusat Islami</button>

      </nav>

      <div class="label">PERSONAL</div>
      <nav>
        <button class="nav" data-page="history"><span>◷</span> Riwayat Chat</button>
        <button class="nav" data-page="api"><span>⚿</span> API Connection</button>
        <button class="nav" data-page="settings"><span>⚙</span> Pengaturan</button>
      </nav>

      <div class="side-bottom">

          <button class="menu-btn" id="menuBtn" aria-label="Buka menu">☰</button>

        </div>
        <div class="top-end"><i></i> AI WORKSPACE <span class="user-mini">G</span></div>
      </header>

      <section class="content" id="content" aria-live="polite"></section>

      <footer>AI GAZ <span>·</span> Built for your ideas
        <span class="footer-right">Periksa informasi penting dari AI.</span>
      </footer>
    </main>

    <div class="toast" id="toast" role="status"></div>

  <!-- Firebase SDK untuk Login dan Register -->

  <!-- Sistem autentikasi AIGAZ -->
